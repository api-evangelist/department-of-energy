    url: https://developer.nlr.gov/contact-us
- aid: department-of-energy:buildings-performance-database
  name: Buildings Performance Database API
  description: >-
    The Buildings Performance Database (BPD) is a DOE repository of anonymized empirical performance records
    for commercial and residential buildings. The BPD API allows partners to query aggregate distributions
    and compare cohorts of buildings across attributes such as building type, vintage, climate zone, and
    energy use intensity.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.energy.gov/eere/buildings/application-programming-interface
  baseURL: https://api.example.com
  tags:
  - BPD
  - Benchmarking
  - Buildings
  - Energy Efficiency
  properties:
  - type: Documentation
    url: https://www.energy.gov/eere/buildings/application-programming-interface
  contact:
  - FN: DOE Building Technologies Office
    url: https://www.energy.gov/eere/buildings
- aid: department-of-energy:open-data-catalog
  name: Department of Energy Open Data Catalog
  description: >-
    The DOE participates in Data.gov by publishing thousands of dataset records under the doe-gov organization.
    These datasets cover energy consumption, generation, environmental impact, R&D, and more, and are
    accessible through Data.gov's CKAN-compatible API.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://catalog.data.gov/organization/doe-gov
  baseURL: https://catalog.data.gov/api/3
  tags:
  - CKAN
  - Datasets
  - Open Data
  properties:
  - type: Documentation
    url: https://catalog.data.gov/organization/doe-gov
  - type: Open Energy Data
    url: https://www.energy.gov/data/open-energy-data
  - type: CKAN Reference
    url: https://docs.ckan.org/en/2.8/api/
  contact:
  - FN: DOE Open Data
    url: https://www.energy.gov/data/open-energy-data
