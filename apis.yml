apis:
- aid: department-of-energy:osti-pages-api
  name: OSTI DOE PAGES API
  description: >-
    The DOE PAGES (Public Access Gateway for Energy and Science) REST API provides programmatic access
    to publications resulting from DOE-funded research, hosted by the Office of Scientific and Technical
    Information (OSTI). The API supports search and retrieval of bibliographic records and full-text links
    for journal articles, accepted manuscripts, and technical reports.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.osti.gov/pages/api/v1/docs
  baseURL: https://www.osti.gov/pages/api/v1
  tags:
  - Bibliographic
  - OSTI
  - Publications
  - Research
  properties:
  - type: Documentation
    url: https://www.osti.gov/pages/api/v1/docs
  - type: Reference
    url: https://www.osti.gov/api
  contact:
  - FN: OSTI
    email: osti@osti.gov
    url: https://www.osti.gov/contact
- aid: department-of-energy:osti-elink-api
  name: OSTI ELINK API
  description: >-
    The OSTI ELINK API is the Office of Scientific and Technical Information's submission and retrieval
    interface for DOE research records. It supports submission of metadata and full text by DOE-funded
    research organizations, and it powers public retrieval interfaces for OSTI.GOV.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.osti.gov/elink/
  baseURL: https://www.osti.gov/elink
  tags:
  - ELINK
  - Metadata
  - OSTI
  - Submission
  properties:
  - type: Documentation
    url: https://www.osti.gov/elink/
  - type: API
    url: https://www.osti.gov/api
  contact:
  - FN: OSTI ELINK
    email: elink@osti.gov
    url: https://www.osti.gov/contact
- aid: department-of-energy:nrel-developer-api
  name: NREL/NLR Developer Network APIs
  description: >-
    The National Renewable Energy Laboratory (NREL, transitioning to NLR) Developer Network publishes
    a portfolio of REST APIs covering solar resource and PV simulation, alternative fuels and stations,
    electricity utilities and rates, transportation, geothermal, and energy economics. All APIs share
    a common API key model issued through api.data.gov. Existing developer.nrel.gov consumers must migrate
    to developer.nlr.gov by April 30, 2026.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.nlr.gov/
  baseURL: https://developer.nlr.gov/api
  tags:
  - Alternative Fuels
  - Buildings
  - Electricity
  - Geothermal
  - NREL
  - Renewables
  - Solar
  - Transportation
  properties:
